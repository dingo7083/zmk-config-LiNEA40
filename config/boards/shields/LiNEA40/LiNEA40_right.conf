# GPIO
CONFIG_NFCT_PINS_AS_GPIOS=y

# Mouse Emulation
CONFIG_ZMK_POINTING=y
# 高解像度スクロール(HID Resolution Multiplier)。central側でしか有効にならない
# Kconfigなので、left.confに書いても無視される。
# 注意1: 有効にすると内部のホイール単位が「1ノッチ=16ユニット」になる。
#        hi-resを解釈するホストではスクロール量が約1/16になるため、
#        ZMK_POINTING_DEFAULT_SCRL_VAL等を約16倍する再調整が要る。
# 注意2: apply_resolution_scaling()がscaledではなくvalを出力するバグがあり
#        (v0.2.1/v0.3.0/main共通、修正はPR #3383が未マージ)、
#        ホストがmultiplierに15未満を書くとスクロールが暴走・反復する。
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Trackball
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_PMW3610=y    
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_CPI=700
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_SNIPE_CPI=350
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=1
CONFIG_PMW3610_SCROLL_TICK=2
CONFIG_PMW3610_POLLING_RATE_125_SW=y
#CONFIG_PMW3610_FORCE_AWAKE=n
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=40
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=0
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=0
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS
#CONFIG_PMW3610_ORIENTATION_0=y
CONFIG_PMW3610_INVERT_Y=y
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
#CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=500

# Key
#CONFIG_ZMK_TAPPING_TERM_MS=300

#CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
#CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# BLE split latency tuning (このシールドはright=central)
# TX出力を上げてリンクマージンを稼ぎ、再送による遅延・取りこぼしを抑える
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# splitリンクのperipheral latencyを無効化(既定30は最大30接続イベントの
# スキップを許容する省電力設定)
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
# 高速タイピング時のバーストでキューが溢れないよう拡大(既定5)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=10

# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
